name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ostium/package-lock.json
      - name: Install (Ostium)
        working-directory: Ostium
        run: npm ci
      - name: Build (Ostium)
        working-directory: Ostium
        env:
          NEXT_PUBLIC_BASE_PATH: /Freelance/Ostium
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site/Ostium
          cp -r Ostium/out/. site/Ostium/
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Freelance</title>
          <meta http-equiv="refresh" content="0; url=./Ostium/">
          <a href="./Ostium/">Остеум — клиника имплантологии</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
