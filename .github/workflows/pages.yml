name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ostium/package-lock.json
      - name: Install (Ostium)
        working-directory: Ostium
        run: npm ci
      - name: Build (Ostium)
        working-directory: Ostium
        env:
          NEXT_PUBLIC_BASE_PATH: /Freelance/Ostium
        run: npm run build
      - name: Install (Versta)
        working-directory: Versta
        run: npm ci
      - name: Build (Versta)
        working-directory: Versta
        env:
          NEXT_PUBLIC_BASE_PATH: /Freelance/Versta
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Install (Zerno)
        working-directory: Zerno
        run: npm ci
      - name: Build (Zerno)
        working-directory: Zerno
        env:
          NEXT_PUBLIC_BASE_PATH: /Freelance/Zerno
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Install (Geliy)
        working-directory: Geliy
        run: npm ci
      - name: Build (Geliy)
        working-directory: Geliy
        env:
          NEXT_PUBLIC_BASE_PATH: /Freelance/Geliy
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site/Ostium site/Versta site/Zerno site/Geliy
          cp -r Ostium/out/. site/Ostium/
          cp -r Versta/out/. site/Versta/
          cp -r Zerno/out/. site/Zerno/
          cp -r Geliy/out/. site/Geliy/
          touch site/.nojekyll
          cp -r hub/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
